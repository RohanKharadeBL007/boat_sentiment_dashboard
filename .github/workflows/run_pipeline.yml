name: Automated Sentiment Pipeline Run

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  push:
    branches: [main]
    paths:
      - "data/**"
      - "boat_sentiment_dashboard_github/data/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn nltk vaderSentiment anthropic streamlit plotly python-dotenv

      - name: Run AI Agent Orchestrator (dry-run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -f "orchestrator.py" ]; then
            python orchestrator.py --dry-run --n_topics 6 --min_df 2
          elif [ -f "boat_sentiment_dashboard_github/orchestrator.py" ]; then
            cd boat_sentiment_dashboard_github
            python orchestrator.py --dry-run --n_topics 6 --min_df 2
          fi

      - name: Run Agent Eval Harness
        run: |
          if [ -f "eval_harness.py" ]; then
            python eval_harness.py
          elif [ -f "boat_sentiment_dashboard_github/eval_harness.py" ]; then
            cd boat_sentiment_dashboard_github
            python eval_harness.py
          fi

      - name: Commit updated outputs
        run: |
          git config user.name "sentiment-pipeline-bot"
          git config user.email "actions@github.com"
          git add outputs/ logs/ boat_sentiment_dashboard_github/outputs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Automated pipeline run [skip ci]"
          git push
